title: 'Salesforce Ventures Guide to Investing in Robotics'
key_insights: 7-criteria framework for evaluating robotics companies — talent depth across AI/hardware/ops, demo authenticity (look for staging/teleoperation), three performance pillars (quality, throughput, robustness), training and deployment scalability, data strategy defensibility, market traction, and hardware-software integration. Argues physical-world AI will develop stronger moats than pure software because implementing AI in the physical world is harder than in digital. Distinguishes full-stack companies (custom hardware + AI) from robotics foundation model plays. Key metric: time-to-first-useful-task at new sites.
